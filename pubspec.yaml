name: smokeguard
description: "SmokeGuard - Wearable Smoke Sensor & Environmental Exposure Monitoring Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <1.0.0'


  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Backend & Network
  supabase_flutter: ^2.8.3

  # BLE & Device
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.1

  # Storage & Offline
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Alerts & Background Service
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^8.17.0

  # Charts & Reports
  fl_chart: ^0.70.2
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
